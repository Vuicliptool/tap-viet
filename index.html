<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bé Vui Học Tiếng Việt</title>
    <!-- Liên kết file manifest để biến web thành app cài đặt được -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff7675">

    <style>
        /* Ép buộc nền cố định bằng background.png */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            background: url('background.jpg') no-repeat center center fixed;
            background-size: cover; /* Phủ kín màn hình */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            text-align: center;
            padding: 20px 10px;
            box-sizing: border-box;
            position: relative;
        }

        /* Nút bật/tắt nhạc nền góc trên */
        .music-toggle-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #ff7675;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: 0.2s;
            z-index: 10;
        }

        .music-toggle-btn:active {
            transform: scale(0.9);
        }

        h1 {
            color: #ff4500;
            font-size: 2.1rem;
            margin-top: 10px;
            margin-bottom: 5px;
            text-shadow: 3px 3px 0px #fff, 5px 5px 0px rgba(0,0,0,0.1);
        }

        p {
            color: #2d3436;
            font-size: 1rem;
            margin-bottom: 20px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.85);
            padding: 6px 14px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 420px;
            margin-bottom: 20px;
        }

        .menu-btn {
            border: 3px solid #fff;
            border-radius: 22px;
            padding: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-decoration: none;
        }

        /* Màu sắc rực rỡ cho từng nút */
        .btn-1 { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); color: #d63031; }
        .btn-2 { background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%); color: #009432; }
        .btn-3 { background: linear-gradient(135deg, #fbc531 0%, #e84118 100%); color: #ffffff; }
        .btn-4 { background: linear-gradient(135deg, #a8ff78 0%, #78ffd6 100%); color: #006644; }
        .btn-5 { background: linear-gradient(135deg, #ffeaa7 0%, #fab1a0 100%); color: #c0392b; }
        .install-btn { background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); color: #fff; display: none; }

        .menu-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 22px rgba(0,0,0,0.2);
        }

        .menu-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <!-- Nút Bật/Tắt Nhạc Nền -->
    <button class="music-toggle-btn" id="music-btn" onclick="toggleMusic()" title="Bật/Tắt nhạc nền">🎵</button>

    <h1>🌟 BÉ VUI HỌC TIẾNG VIỆT 🌟</h1>
    <p>👉 Bé hãy chọn một mục bên dưới để bắt đầu nhé!</p>

    <div class="menu-container">
        <!-- Mục 1: Học âm vần -->
        <a href="hoc_am_van.html" class="menu-btn btn-1">
            <span>📚</span> 1. Bé Học Âm Vần
        </a>

        <!-- Mục 2: Trả lời câu hỏi -->
        <a href="quiz.html" class="menu-btn btn-2">
            <span>🎮</span> 2. Trả Lời Câu Hỏi
        </a>

        <!-- Mục 3: Bé tập ghép chữ -->
        <a href="ghep_chu.html" class="menu-btn btn-3">
            <span>🧩</span> 3. Bé Tập Ghép Chữ
        </a>

        <!-- Mục 4.1: Bé tập viết chữ cái -->
        <a href="tap_viet_chu.html" class="menu-btn btn-4">
            <span>✍️</span> 4. Bé Tập Viết Chữ Cái
        </a>

        <!-- Mục 4.2: Bé tập viết dấu thanh -->
        <a href="tap_viet_dau.html" class="menu-btn btn-5">
            <span>✏️</span> 5. Bé Tập Viết Dấu Thanh
        </a>

        <!-- Nút Cài đặt ứng dụng trực tiếp -->
        <button id="install-app-btn" class="menu-btn install-btn">
            <span>📲</span> Cài Đặt Ứng Dụng Về Máy
        </button>
    </div>

    <!-- Thẻ Audio phát nhạc nền nhac_nen.m4a -->
    <audio id="bg-music" src="nhac_nen.m4a" loop preload="auto"></audio>

    <script>
        const bgMusic = document.getElementById('bg-music');
        const musicBtn = document.getElementById('music-btn');
        let isPlaying = false;

        // Hàm phát nhạc nền (tự động xử lý chặn của trình duyệt)
        function startBackgroundMusic() {
            bgMusic.volume = 0.4; // Đặt âm lượng vừa phải (40%) để không bị quá to
            bgMusic.play().then(() => {
                isPlaying = true;
                musicBtn.innerText = "🎵";
            }).catch(error => {
                console.log("Trình duyệt chặn tự phát nhạc, chờ thao tác chạm từ bé.");
            });
        }

        // Bật/Tắt nhạc khi bấm vào nút góc trên
        function toggleMusic() {
            if (isPlaying) {
                bgMusic.pause();
                isPlaying = false;
                musicBtn.innerText = "🔇";
            } else {
                bgMusic.play().then(() => {
                    isPlaying = true;
                    musicBtn.innerText = "🎵";
                });
            }
        }

        // Tự động kích hoạt nhạc khi bé chạm/click bất kỳ đâu trên màn hình lần đầu tiên
        document.addEventListener('click', () => {
            if (!isPlaying) {
                startBackgroundMusic();
            }
        }, { once: true });

        window.addEventListener('DOMContentLoaded', () => {
            startBackgroundMusic();
        });

        // Xử lý cài đặt PWA
        let deferredPrompt;
        const installBtn = document.getElementById('install-app-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'flex';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('Người dùng đã đồng ý cài đặt ứng dụng');
                }
                deferredPrompt = null;
                installBtn.style.display = 'none';
            }
        });

        window.addEventListener('appinstalled', (evt) => {
            console.log('Ứng dụng đã được cài đặt thành công!');
            installBtn.style.display = 'none';
        });
    </script>

</body>
</html>
